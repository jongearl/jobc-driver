# rootLogger # Logger Level(Fatal > Error > Warning > Info > Debug > Trace), \u00ea\u00b0\u009d\u00ec\u00b2\u00b4\u00eb\u00aa\u0085, \u00ea\u00b0\u009d\u00ec\u00b2\u00b4\u00eb\u00aa\u0085 
log4j.rootLogger=DEBUG, consoleAppender, fileAppender, sql 
# rootLogger \u00ec\u0097\u0090\u00ec\u0084\u009c \u00ec\u00a0\u0095\u00ec\u009d\u0098\u00ed\u0095\u009c \u00ea\u00b0\u009d\u00ec\u00b2\u00b4\u00ec\u0097\u0090 \u00ed\u0083\u0080\u00ec\u009e\u0085\u00ea\u00b3\u00bc \u00ea\u00b8\u00b0\u00eb\u008a\u00a5\u00ec\u009d\u0084 \u00ec\u00a0\u0095\u00ec\u009d\u0098 
# log4j.appender.consoleAppender => Console\u00ec\u0097\u0090 \u00ec\u00b6\u009c\u00eb\u00a0\u00a5\u00ed\u0095\u00b4\u00ec\u00a3\u00bc\u00eb\u008a\u0094 \u00ea\u00b0\u009d\u00ec\u00b2\u00b4 
# org.apache.log4j.ConsoleAppender : \u00ec\u00bd\u0098\u00ec\u0086\u0094\u00ec\u0095\u00a0 \u00ec\u00b6\u009c\u00eb\u00a0\u00a5\u00ed\u0095\u00b4 \u00ec\u00a3\u00bc\u00ea\u00b2\u00a0\u00eb\u008b\u00a4. 
log4j.appender.consoleAppender=org.apache.log4j.ConsoleAppender 
log4j.appender.consoleAppender.Threshold=All 
log4j.appender.consoleAppender.encoding=UTF-8
# layout : console\u00ec\u0097\u0090 \u00ec\u00b6\u009c\u00eb\u00a0\u00a5\u00ec\u009d\u0084 \u00ed\u0095\u00a0 \u00eb\u0095\u008c ConversionPattern \u00ed\u0098\u0095\u00ed\u0083\u009c\u00eb\u00a1\u009c \u00ec\u00b6\u009c\u00eb\u00a0\u00a5\u00ec\u009d\u0084 \u00ed\u0095\u00b4\u00ec\u00a4\u0080\u00eb\u008b\u00a4. 
log4j.appender.consoleAppender.layout=org.apache.log4j.PatternLayout 
# log4j.appender.consoleAppender.layout.ConversionPattern=[%t] %-5p %c %x - %m%n 
log4j.appender.consoleAppender.layout.ConversionPattern=[%d] [%-5p] %c %x - %m%n 
# log4j.appender.fileAppender => \u00ed\u008c\u008c\u00ec\u009d\u00bc\u00eb\u00a1\u009c \u00ec\u00a0\u0080\u00ec\u009e\u00a5\u00ed\u0095\u0098\u00ea\u00b2\u00a0\u00eb\u008b\u00a4. 
# org.apache.log4j.RollingFileAppender \u00ed\u0095\u0098\u00eb\u00a3\u00a8\u00ec\u0097\u0090 \u00ed\u0095\u009c\u00eb\u00b2\u0088\u00ec\u0094\u00a9 \u00ed\u008c\u008c\u00ec\u009d\u00bc\u00ec\u009d\u0084 \u00ec\u0083\u009d\u00ec\u0084\u00b1\u00ed\u0095\u00b4\u00ec\u0084\u009c \u00eb\u00a1\u009c\u00ea\u00b7\u00b8\u00eb\u00a5\u00bc \u00ec\u00a0\u0080\u00ec\u009e\u00a5\u00ed\u0095\u00b4 \u00ec\u00a3\u00bc\u00ea\u00b2\u00a0\u00eb\u008b\u00a4. 
log4j.appender.fileAppender=org.apache.log4j.DailyRollingFileAppender 
# File : \u00ed\u008c\u008c\u00ec\u009d\u00bc\u00ec\u009d\u0098 \u00ec\u009c\u0084\u00ec\u00b9\u0098\u00ea\u00b0\u0080 \u00ec\u0096\u00b4\u00eb\u0094\u0094\u00ea\u00b3\u00a0 \u00ec\u0096\u00b4\u00eb\u0096\u00a0\u00ed\u0095\u009c \u00ed\u008c\u008c\u00ec\u009d\u00bc\u00ec\u009d\u0084 \u00eb\u00aa\u0085\u00ec\u009c\u00bc\u00eb\u00a1\u009c \u00ec\u0083\u009d\u00ec\u0084\u00b1\u00ed\u0095\u0098\u00ea\u00b2\u00a0\u00eb\u008b\u00a4. 
# log4j.appender.fileAppender.File=demoApplication.log log4j.appender.fileAppender.File=c:/log/log4j.log 
# \u00ed\u0095\u0098\u00eb\u00a3\u00a8\u00ea\u00b0\u0080 \u00ec\u00a7\u0080\u00eb\u0082\u009c \u00ed\u008c\u008c\u00ec\u009d\u00bc\u00ec\u009d\u0080 goodee.log\u00ec\u0097\u0090\u00ec\u0084\u009c goodee.2021-04-12 \u00ec\u009d\u00b4\u00eb\u00a0\u0087\u00ea\u00b2\u008c \u00eb\u00b0\u0094\u00ea\u00be\u00b8\u00ea\u00b2\u00a0\u00eb\u008b\u00a4. 
log4j.appender.fileAppender.DatePattern='.'yyyy-MM-dd 
log4j.appender.fileAppender.Threshold=All 
log4j.appender.fileAppender.layout=org.apache.log4j.PatternLayout 
# log4j.appender.fileAppender.layout.ConversionPattern=[%t] %-5p %c %x - %m%n 
log4j.appender.fileAppender.layout.ConversionPattern=[%d] [%-5p] [%13F\:%L] - %m%n
log4j.appender.fileAppender.encoding=UTF-8

